<div
  class="arcade-style p-3 backdrop-blur-xl max-w-3xl mx-auto rounded-xl shadow-2xl bg-white/20 border-8 border-white w-2xl"
>
  <div class="text">
    <form class="flex flex-col gap-3" (submit)="submitRegister(); $event.preventDefault()">
      <label class="text-2xl" for="name">Name</label>
      <input
        id="name"
        type="text"
        [formField]="registerForm.name"
        class="text-xl px-3 py-2 rounded-lg border-2 border-white/70 bg-white/90"
      />

      <label class="text-2xl" for="email">Email</label>
      <input
        id="email"
        type="email"
        [formField]="registerForm.email"
        class="text-xl px-3 py-2 rounded-lg border-2 border-white/70 bg-white/90"
      />

      <label class="text-2xl" for="password">Password</label>
      <input
        id="password"
        type="password"
        [formField]="registerForm.password"
        class="text-xl px-3 py-2 rounded-lg border-2 border-white/70 bg-white/90"
      />

      <label class="text-2xl" for="avatar">Avatar</label>
      <input
        id="avatar"
        type="file"
        class="form-control"
        accept="image/*"
        encodeBase64
        (encoded)="setImg($event)"
        class="text-xl px-3 py-2 rounded-lg border-2 border-white/70 bg-white/90"
      />

      <button
        type="submit"
        class="mt-2 text-3xl text-orange-400 bg-white/80 hover:bg-teal-200 px-4 py-2 rounded-xl transition-all cursor-pointer"
      >
        Register
      </button>
    </form>
    <p class="text-2xl">Already have an account? <a [routerLink]="['/auth/login']">Login</a></p>
  </div>
</div>
