<div>
  <div class="flex justify-center px-6 pt-6">
    <img
      ngSrc="img/logo.png"
      width="672"
      height="377"
      priority
      alt="Super Paria"
      class="logo-float h-auto w-full max-w-2xl object-contain"
    />
  </div>
  <div
    id="userData"
    class="arcade-style absolute top-0 right-0 z-10 flex items-center justify-end gap-4 px-4 py-3 text-2xl text-teal-400 sm:px-6"
  >
    @if (user()) {
      <img
        [src]="user()?.img"
        [alt]="'Avatar de ' + user()?.name"
        class="h-16 w-16 shrink-0 rounded-full border-2 border-teal-400 object-cover"
      />
      <span class="max-w-48">{{ user()?.name }}</span>
      <button
        type="button"
        class="cursor-pointer text-lg transition-transform hover:scale-105 hover:text-teal-300"
        (click)="logout()"
      >
        Logout
      </button>
    } @else {
      <a class="cursor-pointer" [routerLink]="['auth/login']"> Login </a>
    }
  </div>
</div>
<div
  class="arcade-style p-3 backdrop-blur-xl max-w-3xl mx-auto rounded-xl shadow-2xl bg-white/20 border-8 border-white w-2xl"
>
  <ul class="text-7xl text-teal-400 text-center">
    <li class="hover:scale-105 hover:text-teal-300 transition-all duration-200 cursor-pointer">
      <a [routerLink]="['play']">PLAY</a>
    </li>
    <li class="hover:scale-105 hover:text-teal-300 transition-all duration-200 cursor-pointer">
      <a [routerLink]="['/ranking']">SCORE RANKING</a>
    </li>
  </ul>
</div>
