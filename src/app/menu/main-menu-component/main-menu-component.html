<div class="flex flex-col">
  <div
    id="userData"
    class="arcade-style top-0 right-0 z-10 flex items-center justify-end gap-4 px-4 py-3 text-2xl text-teal-400 sm:px-6"
  >
    @if (user()) {
      <img
        [src]="user()?.img"
        [alt]="'Avatar de ' + user()?.name"
        class="h-16 w-16 shrink-0 rounded-full border-2 border-teal-400 object-cover"
      />
      <span class="max-w-48">{{ user()?.name }}</span>
      <button
        type="button"
        class="cursor-pointer text-lg transition-transform hover:scale-105 hover:text-teal-300"
        (click)="logout()"
      >
        Logout
      </button>
    } @else {
      <a class="cursor-pointer" [routerLink]="['auth/login']"> Login </a>
    }
  </div>
  <div class="flex justify-center px-6 pt-6">
    <img
      ngSrc="img/logo.png"
      width="672"
      height="377"
      priority
      alt="Super Paria"
      class="logo-float h-auto w-full max-w-2xl object-contain"
    />
  </div>
</div>
<div class="arcade-style p-3">
  <ul class="text-center text-7xl text-teal-400">
    <li class="cursor-pointer transition-all duration-200 hover:scale-105 hover:text-teal-300">
      <a [routerLink]="['play']">PLAY</a>
    </li>
    <li class="cursor-pointer transition-all duration-200 hover:scale-105 hover:text-teal-300">
      <a [routerLink]="['/ranking']">SCORE RANKING</a>
    </li>
  </ul>
</div>
