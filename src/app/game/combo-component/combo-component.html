@if ((currentCombo() ?? 0) >= 2 && !gameOver()) {
  <div
    [class.text-red-500]=""
    class="flex flex-col combo text-7xl animate-bounce fixed right-1/12 top-1/2 select-none"
    [style.animationDuration]="animationDuration()"
  >
    <div>
      <span class="text-orange-400">
        {{ currentComboObject().name }}
      </span>
      <span class="text-teal-500">
        {{ currentComboObject().number }}
      </span>
      <span class="text-orange-400"> COMBO </span>
    </div>
    <div class="flex gap-1 justify-end">
      <span class="combo text-4xl text-teal-500"> {{ currentComboObject().score }}</span>
      <span class="combo text-xl text-orange-400">pts</span>
    </div>
  </div>
}
