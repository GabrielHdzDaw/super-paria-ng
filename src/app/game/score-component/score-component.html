<div
  class="score score-container backdrop-blur-xl flex flex-col gap-10 justify-center items-center w-full px-24 py-12 absolute z-50 border-8 border-white rounded-xl text-7xl text-teal-700 shadow-2xl"
>
  <div class="flex gap-10 text-8xl">
    <h1 class="text-orange-400">TOTAL SCORE</h1>
    <p class="text-teal-500">{{ totalScore() }}</p>
  </div>
  <div class="flex gap-10">
    <h1 class="text-orange-400">TIME</h1>
    <p class="text-teal-500" [class.count-active]="">{{ displayedTime() }}</p>
  </div>
  <div>
    @for (combo of combos(); track $index; let i = $index) {
      <div class="flex gap-5 combo" [class.count-active]="i === activeComboIndex()">
        <div>
          <span class="text-orange-400">
            {{ combo.name }}
          </span>
          <span class="text-teal-500">
            {{ combo.number }}
          </span>
          <span class="text-orange-400"> COMBO </span>
        </div>
        <div class="flex gap-1 justify-end">
          <span class="combo text-4xl text-teal-500"> {{ combo.score }}</span>
          <span class="combo text-xl text-orange-400">pts</span>
        </div>
      </div>
    }
  </div>
  <div class="flex flex-wrap justify-center gap-5">
    <button
      type="button"
      (click)="playAgain.emit()"
      class="arcade-style cursor-pointer rounded-2xl px-5 py-1 text-5xl text-orange-400 backdrop-blur-xl transition-all duration-200 hover:scale-105 hover:bg-teal-300"
    >
      Play again
    </button>
    <button
      type="button"
      [routerLink]="['/']"
      class="arcade-style cursor-pointer rounded-2xl px-5 py-1 text-5xl text-orange-400 backdrop-blur-xl transition-all duration-200 hover:scale-105 hover:bg-teal-300"
    >
      Main menu
    </button>
  </div>
</div>
