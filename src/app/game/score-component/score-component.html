<div
  class="score score-container backdrop-blur-xl flex flex-col gap-3 justify-center items-center w-full px-24 py-12 absolute z-50 border-4 border-white rounded-xl text-7xl text-teal-700"
>
  <div class="flex gap-10">
    <h1>TOTAL SCORE</h1>
    <p>{{ totalScore() }}</p>
  </div>
  <div class="flex">
    <span>TIME</span>
    <p>{{ time() }}</p>
  </div>
  <div>
    @for (combo of combos(); track $index) {
      <p>{{ combo.name }} {{ combo.score }}</p>
    }
  </div>
</div>
